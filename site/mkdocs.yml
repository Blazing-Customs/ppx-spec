site_name: PPX — Preference Profile Exchange
site_description: Portable, user-owned, consented preference and context profiles for agent ecosystems.
# The standard lives at its own name. GitHub Pages still builds this site and
# now emits <link rel="canonical"> pointing here, so the two copies consolidate
# rather than compete.
site_url: https://ppx.dev/

# Restored 2026-07-30 when the repository was made public. These render a repo
# link and an "Edit this page" button on every page; while ppx-spec was private
# they 404'd for everyone who was not a collaborator. If it ever goes private
# again, unset all three and re-comment `content.action.edit` below - and note
# that hooks/repo_links.py already declines to emit source links when repo_url
# is empty, so it degrades correctly on its own.
repo_url: https://github.com/Blazing-Customs/ppx-spec
repo_name: Blazing-Customs/ppx-spec
edit_uri: edit/main/site/docs/
copyright: >
  &copy; 2026 PPX contributors. Spec prose
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>;
  schemas and code <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache 2.0</a>.

docs_dir: docs

# registry/ is unfinished work: it is not in the nav, its `registry_providers`
# macro renders as raw Jinja, and it publicly describes a PAID certification
# tier. Excluding it keeps it out of the build AND out of sitemap.xml, so it is
# neither reachable nor crawlable until someone decides to ship it.
exclude_docs: |
  registry/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.ico

extra_css:
  - assets/extra.css

extra:
  status:
    new: Recently added
    deprecated: Deprecated
  version:
    default: latest

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
        - ..
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - include-markdown

# Repairs repo-root links (SPEC.md, governance/, bindings/) that arrive via
# include-markdown and would otherwise resolve outside the published site.
hooks:
  - hooks/repo_links.py
  # Publishes schemas/ and examples/ at the site root so each schema's `$id`
  # dereferences. Verifies byte-identity with the repo on every build.
  - hooks/publish_schemas.py

nav:
  - Home: index.md
  # External links to the live experience, so it is reachable from the top nav
  # of every page — not only via a callout on the homepage.
  - Try it live: https://ppx.dev/apps/
  - Provider: https://ppx.dev/ppx/
  - Getting started: getting-started.md
  - 30-minute integrator tutorial: tutorial-30-minute-integrator.md
  - Implementations: implementations.md
  - Specification:
      - Read the spec: spec.md
      - Conformance levels: conformance.md
  - Concepts:
      - Profile: concepts/profile.md
      - Claim: concepts/claim.md
      - Consent grant: concepts/consent-grant.md
      - Provenance & confidence: concepts/provenance.md
      - Context modifier: concepts/context-modifier.md
  - Data model:
      - Schemas: data-model/schemas.md
      - Examples: data-model/examples.md
  - Consent & trust: consent-and-trust.md
  - Discovery: discovery.md
  - Extensions:
      - Overview: extensions/overview.md
      - core: extensions/core.md
      - fragrance: extensions/fragrance.md
      - travel: extensions/travel.md
  - Bindings:
      - Overview: bindings/index.md
      - MCP: bindings/mcp.md
      - A2A: bindings/a2a.md
      - AG-UI: bindings/ag-ui.md
      - A2UI: bindings/a2ui.md
      - HTTP: bindings/http.md
  - Governance:
      - Overview: governance/index.md
      - Namespace registration: governance/namespace-registration.md
      - Versioning: governance/versioning.md
      - Proposal template: governance/proposal-template.md
  - Changelog: changelog.md
  - Community: community.md
