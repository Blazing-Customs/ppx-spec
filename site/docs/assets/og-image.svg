<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="PPX social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="980" cy="120" r="200" fill="#7c3aed" opacity="0.25" filter="url(#glow)"/>
  <circle cx="120" cy="510" r="180" fill="#4f46e5" opacity="0.20" filter="url(#glow)"/>

  <!-- left: big PPX logo tile -->
  <g transform="translate(80,175)">
    <rect width="280" height="280" rx="56" fill="url(#tile)"/>
    <rect x="12" y="12" width="256" height="256" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.88" stroke-width="5.5" fill="none" stroke-linecap="round">
      <path d="M 80 140 C 136 105, 172 97, 208 82"/>
      <path d="M 80 140 L 208 140"/>
      <path d="M 80 140 C 136 175, 172 183, 208 198"/>
    </g>
    <circle cx="80" cy="140" r="22" fill="#ffffff"/>
    <circle cx="80" cy="140" r="10" fill="#4f46e5"/>
    <circle cx="208" cy="82" r="12" fill="#ffffff"/>
    <circle cx="208" cy="140" r="12" fill="#ffffff"/>
    <circle cx="208" cy="198" r="12" fill="#ffffff"/>
    <text x="140" y="252" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-weight="800" font-size="28" text-anchor="middle" fill="#ffffff" letter-spacing="8">PPX</text>
  </g>

  <!-- right: wordmark + tagline -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#ffffff">
    <text x="410" y="250" font-size="72" font-weight="800" letter-spacing="-2">Preference</text>
    <text x="410" y="330" font-size="72" font-weight="800" letter-spacing="-2">Profile Exchange</text>
    <text x="410" y="400" font-size="28" font-weight="400" fill="#c4b5fd">Portable, user-owned, consented preference and</text>
    <text x="410" y="438" font-size="28" font-weight="400" fill="#c4b5fd">context profiles for agent ecosystems.</text>
    <rect x="410" y="478" width="6" height="32" fill="url(#accent)"/>
    <text x="430" y="503" font-size="22" font-weight="600" fill="#e9d5ff">Draft v0.1</text>
    <text x="540" y="503" font-size="22" font-weight="400" fill="#a78bfa">· beside MCP · A2A · AG-UI · A2UI</text>
  </g>

  <!-- footer -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" fill="#a78bfa">
    <text x="410" y="580" font-size="20" font-weight="500" opacity="0.85">blazing-customs.github.io/ppx-spec</text>
  </g>
</svg>
